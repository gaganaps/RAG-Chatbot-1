services:
  - type: web
    name: groww-mf-rag-chatbot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: python -m src.ui.server
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: SCHEDULER_HOUR
        value: "10"
      - key: SCHEDULER_MINUTE
        value: "0"
      - key: SCHEDULER_TIMEZONE
        value: "Asia/Kolkata"
      - key: LLM_PROVIDER
        value: "groq"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_API_KEY
        sync: false
